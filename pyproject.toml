[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crosswind-sort"
version = "1.0.0"
description = "A fast pure-Python 4-way hybrid merge sort that beats quicksort"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Kanaka Takanashi" },
]
keywords = ["sort", "merge-sort", "algorithm", "crosswind", "4-way"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/yURI-404/crosswind-sort"

[tool.setuptools.packages.find]
where = ["."]
include = ["crosswind_sort*"]
